<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Windows 11</title>
<style>
:root{--glass:rgba(243,243,243,.78);--edge:rgba(0,0,0,.1);--text:#1a1a1a;--mut:#5f6368;--win:#f9f9f9;--tb:#eef0f4;--chip:rgba(0,0,0,.07);--acc:#0067c0;--sh:0 20px 50px rgba(0,0,0,.35);color-scheme:light}
:root[data-theme="dark"]{--glass:rgba(32,32,36,.8);--edge:rgba(255,255,255,.12);--text:#f3f3f3;--mut:#a8abb3;--win:#252528;--tb:#2e2e33;--chip:rgba(255,255,255,.1);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--text);overflow:hidden;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.glass{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(36px) saturate(1.5);-webkit-backdrop-filter:blur(36px) saturate(1.5)}
.pfp{border-radius:50%;object-fit:cover;display:block}
#lock{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:rgba(0,0,0,.25);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);transition:transform .5s cubic-bezier(.7,0,.2,1),opacity .5s}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
#clock{font-size:clamp(64px,16vw,130px);font-weight:300;letter-spacing:-.04em;line-height:1}
#date{font-size:18px;margin:4px 0 28px;opacity:.85}
#lock .pfp{width:96px;height:96px;border:3px solid rgba(255,255,255,.7);margin-bottom:10px}
#lock p{margin:0 0 14px;font-size:18px;font-weight:600}
.pin{display:flex;gap:8px;width:min(320px,88vw)}
.pin input{flex:1;min-width:0;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.2);color:#fff;font:inherit;font-size:16px}
.pin input::placeholder{color:rgba(255,255,255,.75)}
.pin button{padding:0 18px;border-radius:8px;background:var(--acc);color:#fff;font-weight:600}
#err{height:22px;margin-top:8px;font-size:14px;color:#ffb4b4}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#desk{position:fixed;top:8px;left:8px;bottom:56px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);grid-auto-columns:88px;align-content:start;z-index:1}
.di{width:84px;height:88px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.di:hover{background:rgba(255,255,255,.18)}.di span{font-size:34px;line-height:1.1}
.win{position:fixed;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--edge);border-radius:10px;box-shadow:var(--sh);overflow:hidden;resize:both;min-width:260px;min-height:180px}
.win.hid{display:none}
.win.max{inset:0 0 48px 0!important;width:auto!important;height:auto!important;border-radius:0;resize:none}
.win:fullscreen{border-radius:0;resize:none}
.wt{display:flex;align-items:center;gap:8px;height:36px;padding-left:12px;font-size:12.5px;background:var(--tb);flex:none;user-select:none;touch-action:none}
.wb{margin-left:auto;display:flex;height:100%}.wb button{width:46px;height:100%;display:grid;place-items:center;font-size:13px}
.wb button:hover{background:var(--chip)}.wb .cl:hover{background:#e81123;color:#fff}
.wbody{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.bar2{display:flex;gap:6px;padding:8px 12px;flex:none;border-bottom:1px solid var(--edge);flex-wrap:wrap;align-items:center}
.bar2 button,.btn{padding:6px 12px;border-radius:6px;background:var(--chip);font-size:13px}
.bar2 button:hover,.btn:hover{background:var(--edge)}.btn.p{background:var(--acc);color:#fff}
.gb iframe{flex:1;width:100%;border:0;background:#000}
.gs{padding:14px 16px 0}.gs input{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--edge);background:var(--chip);color:var(--text);font:inherit;outline:none}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:14px 16px 18px}
.tile{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--chip);text-align:left}
.tile:hover{background:var(--edge)}.tile b{font-size:14px}.tile small{color:var(--mut);margin-top:-4px}
.ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:23px;color:#fff}
.np{flex:1;border:0;resize:none;padding:14px;background:none;color:var(--text);font:15px/1.5 Consolas,monospace;outline:none}
.cd{padding:20px 16px 10px;font-size:38px;text-align:right;overflow:hidden;min-height:90px;word-break:break-all}
.ck{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;flex:1}
.ck button{border-radius:8px;background:var(--chip);font-size:20px}.ck button:hover{background:var(--edge)}.ck .eq{background:var(--acc);color:#fff}
.pc{flex:1;min-height:0;overflow:auto;background:#888}.pc canvas{display:block;width:100%;background:#fff;touch-action:none;cursor:crosshair}
.cl2{text-align:center;padding:26px 16px}.cl2 .big{font-size:50px;font-weight:300}.cl2 .sub{color:var(--mut);margin-bottom:28px}
.st{padding:18px 22px}.st h3{margin:14px 0 8px;font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:56px;height:38px;border-radius:8px;border:2px solid transparent}.sw.on{border-color:var(--acc)}
.sn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px}.sn canvas{width:min(100%,320px);background:#0f172a;border-radius:8px}
.pad{display:flex;gap:8px}.pad button{width:48px;height:40px;border-radius:8px;background:var(--chip)}
#start{position:fixed;left:50%;bottom:60px;width:min(620px,96vw);max-height:min(560px,calc(100% - 80px));z-index:150;border-radius:14px;padding:22px;display:flex;flex-direction:column;box-shadow:var(--sh);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:.18s}
#start.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#sq{padding:10px 16px;border-radius:999px;border:1px solid var(--edge);background:var(--chip);color:var(--text);font:inherit;outline:none;margin-bottom:14px}
#sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:4px;overflow:auto;flex:1}
#sg button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:8px;font-size:12px;text-align:center}
#sg button:hover{background:var(--chip)}#sg .i{font-size:28px}
.sf{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--edge);font-weight:600;font-size:14px}.sf .pfp{width:32px;height:32px}.sf button{margin-left:auto;padding:8px 12px;border-radius:8px;background:var(--chip)}
#qs{position:fixed;right:10px;bottom:58px;z-index:150;width:310px;max-width:96vw;border-radius:14px;padding:18px;box-shadow:var(--sh);display:none;flex-direction:column;gap:12px;font-size:14px}
#qs.show{display:flex}#qs input{width:100%;accent-color:var(--acc)}
#bar{position:fixed;left:0;right:0;bottom:0;height:calc(48px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);z-index:160;display:flex;align-items:center;border-width:1px 0 0}
#mid{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:2px;max-width:calc(100% - 200px);overflow-x:auto}
.tbi{position:relative;flex:none;width:42px;height:40px;border-radius:6px;font-size:21px;display:grid;place-items:center}
.tbi:hover{background:var(--chip)}.tbi.open::after{content:"";position:absolute;bottom:2px;width:6px;height:3px;border-radius:2px;background:var(--mut)}
.tbi.foc{background:var(--chip)}.tbi.foc::after{width:16px;background:var(--acc)}
.wl{display:grid;grid-template:1fr 1fr/1fr 1fr;gap:2px;width:18px;height:18px}.wl i{background:var(--acc);border-radius:1px}
#tray{margin-left:auto;display:flex;align-items:center;gap:10px;padding:0 12px;height:40px;border-radius:6px;font-size:12px;text-align:right;line-height:1.25}
#tray:hover{background:var(--chip)}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:999}
@media (max-width:640px){#tray .tt{display:none}#mid{max-width:calc(100% - 90px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="lock" aria-label="Lock screen">
  <div id="clock">00:00</div><div id="date"></div>
  <img class="pfp" alt="Profile picture"><p>Player</p>
  <form class="pin" id="pf" onsubmit="return false"><input id="pin" type="password" placeholder="Access code" autocomplete="off" aria-label="Access code"><button id="go">Sign in</button></form>
  <div id="err" role="alert"></div>
</section>
<div id="desk"></div><div id="wins"></div>
<section id="start" class="glass" aria-label="Start menu"><input id="sq" type="search" placeholder="Search apps and games" autocomplete="off"><div id="sg"></div>
  <div class="sf"><img class="pfp" alt=""><span>Player</span><button id="sl">Lock</button></div></section>
<section id="qs" class="glass" aria-label="Quick settings">
  <label>Brightness<input id="br" type="range" min="30" max="100" value="100"></label>
  <label>Volume<input type="range" min="0" max="100" value="60"></label>
  <div style="display:flex;gap:8px"><button class="btn" id="qd">🌓 Dark mode</button><button class="btn" id="ql">🔒 Lock</button></div></section>
<nav id="bar" class="glass" aria-label="Taskbar"><div id="mid"><button class="tbi" id="sb" aria-label="Start"><div class="wl"><i></i><i></i><i></i><i></i></div></button><span id="tbc" style="display:flex;gap:2px"></span></div>
  <button id="tray" aria-label="Quick settings"><span>📶 🔊 🔋</span><span class="tt"><span id="tt"></span><br><span id="td"></span></span></button></nav>
<div id="dim"></div>
